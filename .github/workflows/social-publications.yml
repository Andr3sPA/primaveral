name: Social publication queue

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: social-publications
  cancel-in-progress: false

jobs:
  process:
    name: Process due publications
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 2
    steps:
      - name: Validate configuration
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_URL" ]]; then
            echo "::error::Set APP_URL in the prod environment variables."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *)
              echo "::error::APP_URL must use HTTPS."
              exit 1
              ;;
          esac
          app_origin="${APP_URL#https://}"
          app_origin="${app_origin%/}"
          if [[ -z "$app_origin" || "$app_origin" == */* || "$app_origin" == *\?* || "$app_origin" == *\#* || "$app_origin" == *@* ]]; then
            echo "::error::APP_URL must be a canonical HTTPS origin without credentials, path, query, or fragment."
            exit 1
          fi
          if [[ ${#CRON_SECRET} -lt 32 ]]; then
            echo "::error::Set CRON_SECRET in the prod environment secrets to a value of at least 32 characters."
            exit 1
          fi

      - name: Process due social publications
        shell: bash
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          app_url="${APP_URL%/}"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 70 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${app_url}/api/cron/social-publications"
